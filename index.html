<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>India Innovates | Voter Portal Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1e;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { background: rgba(99,102,241,0.25); top: -200px; left: -200px; }
    .glow-2 { background: rgba(16,185,129,0.15); bottom: -200px; right: -200px; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    .emblem {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
    }

    .emblem-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .emblem h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.3px;
    }

    .emblem p {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #f1f5f9;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: rgba(255,255,255,0.25); }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .input-group { margin-bottom: 20px; }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .otp-hint {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }

    #step-otp { display: none; }

    .step-label {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <div class="emblem">
      <div class="emblem-icon">🗳️</div>
      <h1>India Innovates</h1>
      <p>Electoral Roll Management System</p>
    </div>

    <div id="step-id">
      <p class="step-label">Step 1 of 2 — Identify yourself</p>
      <div class="input-group">
        <label for="user-id">User ID (Email or EPIC Number)</label>
        <input type="text" id="user-id" placeholder="e.g. admin@mcd.gov.in or ABC1234567"/>
      </div>
      <button id="btn-send-otp" onclick="sendOtp()">Send OTP</button>
    </div>

    <div id="step-otp">
      <p class="step-label">Step 2 of 2 — Verify OTP</p>
      <div class="input-group">
        <label for="otp">One-Time Password</label>
        <input type="text" id="otp" maxlength="4" placeholder="Enter 4-digit OTP"/>
      </div>
      <button onclick="verifyOtp()">Verify & Continue</button>
      <div class="otp-hint">Any 4-digit number works for this demo</div>
    </div>
  </div>

  <script>
    let capturedId = "";

    function sendOtp() {
      const val = document.getElementById("user-id").value.trim();
      if (!val) { alert("Please enter your User ID."); return; }
      capturedId = val;
      document.getElementById("step-id").style.display = "none";
      document.getElementById("step-otp").style.display = "block";
    }

    async function verifyOtp() {
      const otp = document.getElementById("otp").value.trim();
      if (!/^\d{4}$/.test(otp)) { alert("Enter a valid 4-digit OTP."); return; }
      if (capturedId === "admin@mcd.gov.in") {
        window.location.href = "admin.html";
        return;
      }
      const res = await fetch("/api/citizen/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ epic_number: capturedId })
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.detail || "Voter ID not found.");
        return;
      }
      window.location.href = "citizen.html?epic=" + encodeURIComponent(capturedId);
    }
  </script>
</body>
</html>
