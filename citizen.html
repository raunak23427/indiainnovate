<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen Portal | India Innovates</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0f1e;
      color: #f1f5f9;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { background: rgba(99,102,241,0.18); top: -150px; right: -150px; }
    .glow-2 { background: rgba(16,185,129,0.12); bottom: -150px; left: -150px; }

    nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(10,15,30,0.85);
      backdrop-filter: blur(12px);
    }

    .nav-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }

    nav h2 { font-size: 15px; font-weight: 700; }

    .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(99,102,241,0.18);
      border: 1px solid rgba(99,102,241,0.3);
      color: #818cf8;
      font-weight: 600;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .greeting {
      margin-bottom: 28px;
    }

    .greeting .label {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .greeting h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .greeting h1 span {
      background: linear-gradient(135deg, #818cf8, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .greeting p {
      margin-top: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.38);
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 28px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #f1f5f9;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      resize: vertical;
      min-height: 120px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.6;
    }

    textarea::placeholder { color: rgba(255,255,255,0.22); }
    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
    }

    .file-zone {
      position: relative;
      border: 2px dashed rgba(99,102,241,0.3);
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .file-zone:hover {
      border-color: rgba(99,102,241,0.6);
      background: rgba(99,102,241,0.04);
    }

    .file-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-icon { font-size: 26px; margin-bottom: 6px; }
    .file-label { font-size: 13px; color: rgba(255,255,255,0.5); }
    .file-hint { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 4px; }
    #file-name { font-size: 12px; color: #818cf8; margin-top: 10px; min-height: 16px; text-align: center; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    #status { margin-top: 18px; min-height: 0; }

    .status-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 12px;
      color: #818cf8;
      font-size: 13px;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(99,102,241,0.3);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-success {
      padding: 14px 16px;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 12px;
      color: #34d399;
      font-size: 13px;
    }

    .status-error {
      padding: 14px 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 12px;
      color: #f87171;
      font-size: 13px;
    }

    .category-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(99,102,241,0.18);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <nav>
    <div class="nav-icon">🗳️</div>
    <h2>India Innovates</h2>
    <span class="badge">Citizen Portal</span>
  </nav>

  <div class="page">
    <div class="greeting">
      <div class="label">Electoral Roll Management System</div>
      <h1>Welcome, Voter <span id="epic-display">—</span></h1>
      <p>Use the form below to report a civic issue in your ward.</p>
    </div>

    <div class="card">
      <div class="card-title">📋 Submit a Grievance</div>

      <div class="field">
        <label for="grievance">Issue Description</label>
        <textarea id="grievance" placeholder="Describe your civic issue…"></textarea>
      </div>

      <div class="field">
        <label>Attach Photo (Optional)</label>
        <div class="file-zone">
          <input type="file" accept=".jpg,.jpeg,.png" onchange="onFileChange(event)"/>
          <div class="file-icon">📷</div>
          <div class="file-label">Click to attach a photo</div>
          <div class="file-hint">JPG or PNG • Demo only</div>
        </div>
        <div id="file-name"></div>
      </div>

      <button id="submit-btn" onclick="submitGrievance()">Submit Grievance</button>

      <div id="status"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const epic = params.get("epic") || "Unknown";
    document.getElementById("epic-display").textContent = epic;

    function onFileChange(event) {
      const file = event.target.files[0];
      document.getElementById("file-name").textContent = file ? file.name : "";
    }

    async function submitGrievance() {
      const text = document.getElementById("grievance").value.trim();
      if (!text) { alert("Please describe your issue before submitting."); return; }

      const btn = document.getElementById("submit-btn");
      const statusEl = document.getElementById("status");
      btn.disabled = true;

      statusEl.className = "status-loading";
      statusEl.innerHTML = '<div class="spinner"></div><span>Submitting and categorizing…</span>';

      try {
        const res = await fetch("/api/citizen/complaint", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ epic_number: epic, grievance_text: text })
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.className = "status-error";
          statusEl.textContent = "Error: " + (data.detail || "Submission failed.");
          btn.disabled = false;
          return;
        }

        statusEl.className = "status-success";
        statusEl.innerHTML = "✓ Grievance submitted successfully!<br/><span class='category-pill'>AI Category: " + data.category + "</span>";
        document.getElementById("grievance").value = "";
        document.getElementById("file-name").textContent = "";
      } catch (err) {
        statusEl.className = "status-error";
        statusEl.textContent = "Request failed: " + err.message;
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
